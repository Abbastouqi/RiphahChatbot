<!-- Riphah Chatbot — inline launcher.
     Use this instead of <script src=".../widget.js"> when the bot host is on a
     private network: it renders the icon with zero network requests and only
     loads the bot when the visitor clicks, so the host page never blocks on
     Chrome's local-network permission prompt.
     Paste before </body>; set BOT to your bot host. -->
<script>
(function () {
  var BOT = 'https://ml2.riphah.edu.pk';
  var st = document.createElement('style');
  st.textContent =
    '.rph-btn{position:fixed;right:22px;bottom:22px;z-index:2147483000;width:62px;height:62px;' +
    'border-radius:50%;border:0;cursor:pointer;color:#fff;' +
    'background:linear-gradient(135deg,#6366f1 0%,#8b5cf6 55%,#c084fc 100%);' +
    'box-shadow:0 6px 22px rgba(99,102,241,.45),0 2px 8px rgba(0,0,0,.25);' +
    'display:flex;align-items:center;justify-content:center;' +
    'transition:transform .18s,box-shadow .18s;animation:rph-glow 3s ease-in-out infinite}' +
    '.rph-btn:hover{transform:scale(1.08);box-shadow:0 8px 30px rgba(139,92,246,.6),0 2px 10px rgba(0,0,0,.3)}' +
    '.rph-btn svg{width:30px;height:30px;pointer-events:none}' +
    '@keyframes rph-glow{0%,100%{box-shadow:0 6px 22px rgba(99,102,241,.45),0 2px 8px rgba(0,0,0,.25)}' +
    '50%{box-shadow:0 6px 30px rgba(139,92,246,.65),0 2px 8px rgba(0,0,0,.25)}}' +
    '@media (prefers-reduced-motion:reduce){.rph-btn{animation:none}}' +
    '.rph-panel{position:fixed;right:22px;bottom:94px;z-index:2147483000;' +
    'width:min(400px,calc(100vw - 32px));height:min(620px,calc(100vh - 120px));border-radius:18px;' +
    'overflow:hidden;box-shadow:0 12px 48px rgba(0,0,0,.4);background:#000;opacity:0;' +
    'transform:translateY(14px) scale(.98);pointer-events:none;transition:opacity .22s,transform .22s}' +
    '.rph-panel.open{opacity:1;transform:none;pointer-events:auto}' +
    '.rph-panel iframe{width:100%;height:100%;border:0;display:block}' +
    '@media (max-width:480px){.rph-panel{right:8px;bottom:86px;width:calc(100vw - 16px);height:calc(100vh - 104px)}}';
  document.head.appendChild(st);

  var chat = '<svg viewBox="0 0 24 24" fill="none">' +
    '<path d="M12 2.4v2.2" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>' +
    '<circle cx="12" cy="2.4" r="1.05" fill="#fff"/>' +
    '<path d="M4.6 12.2a7.4 7.4 0 0 1 14.8 0" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/>' +
    '<rect x="5.6" y="6.6" width="12.8" height="11" rx="3.4" fill="#fff"/>' +
    '<rect x="2.7" y="10.6" width="2.5" height="5" rx="1.25" fill="#fff"/>' +
    '<rect x="18.8" y="10.6" width="2.5" height="5" rx="1.25" fill="#fff"/>' +
    '<circle cx="9.4" cy="11.3" r="1.45" stroke="#7255e0" stroke-width="1.5"/>' +
    '<circle cx="14.6" cy="11.3" r="1.45" stroke="#7255e0" stroke-width="1.5"/>' +
    '<path d="M9.6 14.9c.7.75 1.6 1.15 2.4 1.15s1.7-.4 2.4-1.15" stroke="#7255e0" stroke-width="1.5" stroke-linecap="round"/>' +
    '</svg>';
  var x = '<svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>';

  var panel = document.createElement('div'); panel.className = 'rph-panel';
  var btn = document.createElement('button'); btn.className = 'rph-btn';
  btn.type = 'button'; btn.title = 'Ask AI';
  btn.setAttribute('aria-label', 'Ask AI — Riphah assistant'); btn.innerHTML = chat;

  var loaded = false;
  btn.onclick = function () {
    var open = !panel.classList.contains('open');
    if (open && !loaded) {
      // Logged-in site? Set window.RIPHAH_USER_ID = "<portal user id>" before
      // this snippet — history then follows the person, not the browser.
      var uid = (window.RIPHAH_USER_ID || '').toString().trim().slice(0, 64);
      var f = document.createElement('iframe');
      f.src = BOT + '/' + (uid ? '?uid=' + encodeURIComponent(uid) : '');
      f.allow = 'microphone';
      f.title = 'Riphah assistant';
      panel.appendChild(f);
      loaded = true;
    }
    panel.classList.toggle('open', open);
    btn.innerHTML = open ? x : chat;
  };
  document.body.appendChild(panel);
  document.body.appendChild(btn);
})();
</script>
