<!-- Riphah Chatbot — inline launcher.
     Use this instead of <script src=".../widget.js"> when the bot host is on a
     private network: it renders the icon with zero network requests and only
     loads the bot when the visitor clicks, so the host page never blocks on
     Chrome's local-network permission prompt.
     Paste before </body>; set BOT to your bot host. -->
<script>
(function () {
  var BOT = 'https://ml2.riphah.edu.pk';
  var st = document.createElement('style');
  st.textContent =
    '.rph-btn{position:fixed;right:22px;bottom:22px;z-index:2147483000;width:60px;height:60px;' +
    'border-radius:50%;border:0;cursor:pointer;background:#4f46e5;color:#fff;' +
    'box-shadow:0 6px 24px rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center;' +
    'transition:transform .18s,background .18s}.rph-btn:hover{transform:scale(1.07);background:#4338ca}' +
    '.rph-btn svg{width:28px;height:28px;pointer-events:none}' +
    '.rph-panel{position:fixed;right:22px;bottom:94px;z-index:2147483000;' +
    'width:min(400px,calc(100vw - 32px));height:min(620px,calc(100vh - 120px));border-radius:18px;' +
    'overflow:hidden;box-shadow:0 12px 48px rgba(0,0,0,.4);background:#000;opacity:0;' +
    'transform:translateY(14px) scale(.98);pointer-events:none;transition:opacity .22s,transform .22s}' +
    '.rph-panel.open{opacity:1;transform:none;pointer-events:auto}' +
    '.rph-panel iframe{width:100%;height:100%;border:0;display:block}' +
    '@media (max-width:480px){.rph-panel{right:8px;bottom:86px;width:calc(100vw - 16px);height:calc(100vh - 104px)}}';
  document.head.appendChild(st);

  var chat = '<svg viewBox="0 0 24 24" fill="none"><path d="M21 12c0 4.4-4 8-9 8-1.1 0-2.2-.17-3.2-.5L4 21l1.3-3.9C4.5 15.7 3 14 3 12c0-4.4 4-8 9-8s9 3.6 9 8Z" fill="currentColor"/></svg>';
  var x = '<svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>';

  var panel = document.createElement('div'); panel.className = 'rph-panel';
  var btn = document.createElement('button'); btn.className = 'rph-btn';
  btn.type = 'button'; btn.setAttribute('aria-label', 'Riphah assistant'); btn.innerHTML = chat;

  var loaded = false;
  btn.onclick = function () {
    var open = !panel.classList.contains('open');
    if (open && !loaded) {
      // Logged-in site? Set window.RIPHAH_USER_ID = "<portal user id>" before
      // this snippet — history then follows the person, not the browser.
      var uid = (window.RIPHAH_USER_ID || '').toString().trim().slice(0, 64);
      var f = document.createElement('iframe');
      f.src = BOT + '/' + (uid ? '?uid=' + encodeURIComponent(uid) : '');
      f.allow = 'microphone';
      f.title = 'Riphah assistant';
      panel.appendChild(f);
      loaded = true;
    }
    panel.classList.toggle('open', open);
    btn.innerHTML = open ? x : chat;
  };
  document.body.appendChild(panel);
  document.body.appendChild(btn);
})();
</script>
